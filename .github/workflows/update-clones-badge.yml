name: Update Clones Badge

on:
  schedule:
    # 每天 UTC 18:00 = 北京时间 02:00（避开活跃时段，减少冲突）
    - cron: "0 18 * * *"
  workflow_dispatch: # 允许手动触发

permissions:
  contents: write

jobs:
  update-badge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch clones data and update README
        env:
          # Traffic API 需要 repo scope，GITHUB_TOKEN 没有，改用 PAT
          GH_TOKEN: ${{ secrets.TRAFFIC_PAT }}
        run: |
          # 获取近 14 天的 clones 数据（gh api 自动处理 auth + 错误输出）
          CLONES_JSON=$(gh api "repos/${{ github.repository }}/traffic/clones" 2>&1)

          # 提取近 14 天总量
          TOTAL=$(echo "$CLONES_JSON" | jq '.count')
          UNIQUES=$(echo "$CLONES_JSON" | jq '.uniques')

          echo "Clones (14d): total=$TOTAL, uniques=$UNIQUES"

          if [ -z "$TOTAL" ] || [ "$TOTAL" = "null" ]; then
            echo "::error::Failed to parse clones data. Raw response:"
            echo "$CLONES_JSON"
            exit 1
          fi

          # 更新 README 中的 clones 徽章
          # shields.io URL: 空格=%20  斜杠=%2F  →  clones-NNN%20%2F%2014d
          ESCAPED_COUNT="${TOTAL}%20%2F%2014d"

          # 同时更新中英文 README
          sed -i "s|clones-[0-9]*%20%2F%2014d|clones-${ESCAPED_COUNT}|g" README.md README.en.md

          if git diff --quiet README.md README.en.md; then
            echo "No changes — badge count unchanged."
          else
            echo "Badge updated: ${TOTAL} / 14d"
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet README.md README.en.md; then
            echo "Nothing to commit."
            exit 0
          fi

          git add README.md README.en.md
          git commit -m "chore: update clones badge [skip ci]"
          git push
