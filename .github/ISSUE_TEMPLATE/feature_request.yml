name: 功能建议 (Feature request)
description: 提出一个新功能或改进想法
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: motivation
    attributes:
      label: 动机 (Motivation)
      description: 你想要解决什么问题？使用场景是什么？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案 (Proposed solution)
      description: 你期望的功能行为是怎样的
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案 (Alternatives)
      description: 你考虑过的其他做法（可选）
  - type: textarea
    id: notes
    attributes:
      label: 备注 (Notes)
      description: 其他想补充的
