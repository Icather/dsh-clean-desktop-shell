name: Bug 报告 (Bug report)
description: 提交一个 bug，帮助我们改进
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        感谢提交 bug！请尽量填写以下信息，描述越清楚越好。
  - type: input
    id: version
    attributes:
      label: 版本 (Version)
      description: 应用版本（托盘「检查更新」或 GitHub Release 上可以看到）
      placeholder: 例如 0.1.1
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: 平台 (Platform)
      options:
        - Windows
        - macOS
      default: 0
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 问题描述 (Description)
      description: 发生了什么？期望是什么？
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤 (Steps to reproduce)
      description: 一步一步怎么做能触发这个问题
      placeholder: |
        1. 启动壳
        2. 托盘点击「...」
        3. 出现...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志 / 截图 (Logs / Screenshots)
      description: 如有报错窗口、控制台输出或截图，贴在这里
      render: shell
  - type: textarea
    id: context
    attributes:
      label: 其他上下文 (Additional context)
      description: 后端是否在运行、是否使用远程地址等
